[project]
name = "minimal"
language = "en"
docs_dir = "docs"
work_dir = "docs/work"
# owners = ["Your Name"]    # optional: check warns about any other spelling

[flow]
requires = ">=0.3.7,<0.4"

[id]
format = "{date}-{type}-{time}"

[gate]
l1 = ["test"]
l2 = ["test", "lint"]
l3 = ["test", "lint", "e2e"]
# A change here invalidates l1; the gate then says to run l3.
fallback_paths = []

[design]
required_for = ["L", "M"]
require_confirmed = true
# Structural paths: a change here needs a ready design. A real project lists
# its contracts, schema, and deploy scripts; the example keeps this empty so a
# small S change does not trip the rule.
risk_paths = []
risk_exempt = ["docs/"]
risk_gate = "warn"

[commands]
test = "python3 -m unittest discover -s tests -q"
lint = "python3 -m compileall -q src tests"
unit = "python3 -m unittest discover -s tests -q"
e2e = "python3 -m unittest discover -s tests -q"

[docs]
required = ["README.md", "AGENTS.md", "docs/README.md"]
check_links = true
zero_fact = true

[release]
channels = []
dir = "docs/releases"
gate_level = "l3"
mainline = "main"

[reconcile]
risk_paths = []

[extensions]
enabled = []
dir = "docs/flow/extensions"
