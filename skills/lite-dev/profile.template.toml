# lite-dev profile — the only file that holds project-specific facts.
#
# Copy to docs/flow/profile.toml and edit. Artifact headings are a parsing
# contract: keep the templates as they are, write prose in any language.
# Use forward slashes in paths: a TOML basic string treats "\" as an escape.

[project]
name = "my-project"
language = "en"            # en | zh — language for prose, not for headings
# Optional roster of canonical owner spellings. `check` warns about an item
# owned by anyone else, which is how a typo on one machine gets caught early.
# owners = ["Alice Chen", "Bob Li"]
# Where the project root is. Omit it and the tool walks up to the nearest
# repository. Set it when the root is not itself a repository, or when that walk
# would stop at the wrong one (a `docs/` directory that is its own clone).
# It is relative to the directory that holds `docs/`.
# root = "."
# A per-machine name in an untracked file, used only when git config is not
# available because the root is not a repository.
# owner_file = ".lite-dev/owner"
docs_dir = "docs"
# Items live at <work_dir>/<YYYY-MM>/<id>-<slug>/, filed by their created month.
work_dir = "docs/work"

# One project root, several repositories. Omit this table for a single
# repository; declare it and every path in this file becomes workspace-relative,
# and `control` names the repository that carries work items, release records,
# and the gate ledger.
#
# [workspace]
# control = "docs"
#
# [[workspace.repo]]
# path = "svc-a"
# mainline = "main"
#
# [[workspace.repo]]
# path = "svc-b"
# mainline = "main"
# A machine that never checks this out says so, instead of leaving a warning.
# required = false

[flow]
# Required. The hard window: same major, from this minor's `.0`. An install
# outside it is a profile error, so every machine runs a compatible gate.
# Z (patch) inside the window is seamless; Y (minor) still loads but warns, so
# the agent reads the CHANGELOG between `reviewed` and the running version;
# X (major) is outside the window and needs `init --upgrade --accept-major`.
requires = ">=0.7.0,<1.0"
# The exact version this project was last reconciled with. `init` writes it;
# `init --upgrade --apply flow.reviewed` moves it after the review.
reviewed = "0.7.0"

[id]
# {date} -> YYYYMMDD, {type} -> REQ/BUG/TD/OPS/IDEA, {time} -> 6 chars of
# milliseconds since local midnight. The time code sorts ids in creation order
# and lets a clone allocate one without a lock; do not drop it.
# Ownership lives in each item's `owner` field, not here.
format = "{date}-{type}-{time}"

[gate]
# Ordered command names per level. l1 = fast iteration, l2 = batch
# acceptance, l3 = full / commit. Levels you omit are unavailable.
# Invariant: l1 must stay cheap enough to run on every batch.
l1 = ["test"]
l2 = ["test"]
l3 = ["test"]
# Paths whose change invalidates a cheap level: the gate then tells you to run
# the strictest level. Lock files, schema run definitions, toolchain pins.
fallback_paths = []
# Days a recorded PASS stays fresh before `status`/`gate` advise re-running the
# strictest level. Advisory only; nothing is blocked. 0 means always advise.
fresh_days = 5

[design]
# Sizes that require design.md before implementation. M is still a one-session
# change; the design is the record of the plan, not a second execution mode.
required_for = ["L", "M"]
# The human must confirm the plan before design-ready passes.
require_confirmed = true
# Paths that make a change structural: contracts, schema, permissions, deploy
# scripts. `gate --work` then refuses (or warns) without a ready design.
risk_paths = []
# Paths that never trigger that rule, so prose about a risk path does not
# require a design. Keep this list honest: it is the difference between a rule
# that works and one that gets switched off.
risk_exempt = []
# "warn" reports a risk-path change without a design; "block" stops the gate.
risk_gate = "warn"

[commands]
# Any shell command run from the project root. This file is executable input:
# treat it as trusted project configuration, not as data from an untrusted source.
#
# `!unconfigured` is a value, not a comment: `check` reports it and `gate`
# refuses to run it, so a scaffold cannot look wired by accident.
# `init --plan` proposes a command from the repository (Makefile, package.json,
# pyproject.toml, go.mod, Cargo.toml) and reports CI entrypoints; `init --apply
# <id>` writes the one you choose. Nothing is written without that confirmation.
test = "!unconfigured"
# lint = "your linter"
# unit = "your unit test command"
# e2e = "your end-to-end command"
#
# A command may name the repository it runs in. The gate then runs it only when
# that repository is in scope, which is what keeps `l1` cheap in a workspace.
# svc_a_test = { dir = "svc-a", run = "go test ./..." }

[docs]
# These must exist; check reports missing ones as errors.
required = ["README.md", "AGENTS.md", "docs/README.md"]
# Relative links under docs_dir must resolve; every file in an indexed
# directory must be linked from its README; every item artifact must be
# mentioned in item.md; a release record must not repeat a heading.
check_links = true
# Entry documents (README/AGENTS) may not pin versions, ports, dates, or counts:
# each is a fact with a single authority somewhere else.
zero_fact = true
# Optional home for decision records: one file per decision, indexed by its
# README.md (see templates/decision.md). Empty disables the check.
decisions = ""
# Record stores: directories whose files are records, not documents to navigate.
# Items, release records, and `_archive/` are always stores; name requirement or
# asset stores here so they are not asked for an index. Globs are allowed.
# stores = ["docs/projects/*/prds", "docs/resources"]
# Extra document roots, each with its own README.md reachable from the root
# index. Use this instead of widening `docs_dir`, which would walk build output.
# surfaces = ["svc-a/docs"]

# Bounded silences for document checks. Prefer fixing the document; when that is
# not possible yet, register the exception here instead of turning a check off
# for the whole project. Every field is required, `until` is enforced (an
# expired entry is an error, not a silence), and an entry that suppresses
# nothing is reported so it can be removed.
#
# check = links | index | artifact | archive_link | zero_fact | heading |
#         absolute | escape
# path  = path prefix, relative to the project root
#
# [[exempt]]
# check = "links"
# path = "docs/legacy"
# reason = "imported handbook, not maintained here"
# until = "2027-03-31"

[release]
# Channels you record releases for. Empty means `flow.py release` is unavailable.
# `gate_level` must exist in [gate]; --record runs it and refuses on failure.
# `mainline` is required once a channel exists: only that branch may record.
#
# A name in `channels` records against the control repository. In a workspace,
# bind a channel to a repository instead: the record then names that repo, and
# the chain is ordered by that repository's history.
channels = []
# [[release.channel]]
# name = "svc-a"
# repo = "svc-a"
# mainline = "main"
#
# Channels that ship together: `release --group <name> --record` records each
# channel and then writes one index record that links them.
# [[release.group]]
# name = "platform"
# channels = ["svc-a", "svc-b"]
dir = "docs/releases"
gate_level = "l3"
mainline = "main"
# When true, --record refuses without at least one --artifact.
require_artifacts = false
# When true, a release whose source range touches [design] risk_paths needs
# --confirm "<the human's words>"; the record then names who authorized it.
# Requires [design] risk_paths. Off by default: a solo project may not want it.
confirm_risk_paths = false

[reconcile]
# Commit paths that deserve attention when a commit has no work item.
risk_paths = []
# Optional baseline for a project with no release record yet: the commit
# adoption started from. `reconcile` then inspects baseline..HEAD and never
# blocks. `flow.py init --baseline` writes it on a clean tree.
# baseline = "<commit>"

[extensions]
# Declarative add-ons. Resolved from `dir` first, then from the skill's
# extensions/. An extension may add commands, gate steps, docs and risk paths;
# it may not replace or remove anything.
enabled = []
dir = "docs/flow/extensions"
