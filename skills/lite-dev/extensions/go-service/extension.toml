name = "go-service"
version = "1.0.0"
description = "Go service: build, vet, and test with the standard toolchain."
requires = ">=0.6.0,<0.7"

[commands]
go_build = "go build -o \"$(mktemp -d)/\" ./..."
go_test = "go test ./..."
go_vet = "go vet ./..."

[gate]
l1 = ["go_build"]
l2 = ["go_test"]
l3 = ["go_vet"]

[reconcile]
risk_paths = ["migrations/", "internal/auth/"]

# Adoption proposals, not project facts: `init --plan` offers the command when
# the marker file exists, and only `init --apply` writes it.
[[detect]]
file = "go.mod"
command = "go test ./..."
note = "go.mod (go-service extension)"
